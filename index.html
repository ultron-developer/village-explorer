<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Village Explorer Prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- <header class="app-header">
      <h1>Village Explorer</h1>
    </header> -->

    <main class="app-main">
      <section class="map-section">
        <div id="map-container">
          <img src="assets/map01.jpg" alt="" class="map-image" />

          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 72%; left: 54.05%; width: 9%"
            src="assets/Bridge.png"
            alt="Bridge"
          />
          <p class="poi-marker poi-label" style="top: 78%; left: 54%">Bridge</p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 51%; left: 68%; width: 9%"
            src="assets/Fountain.png"
            alt="Fountain"
          />
          <p class="poi-marker poi-label" style="top: 57%; left: 70%">
            Fountain
          </p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 55%; left: 36%; width: 7%"
            src="assets/Cemetery.png"
            alt="Cemetery"
          />
          <p class="poi-marker poi-label" style="top: 58%; left: 44%">
            Cemetery
          </p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 43%; left: 44%; width: 10%"
            src="assets/Hospital.png"
            alt="Hospital"
          />
          <p class="poi-marker poi-label" style="top: 50%; left: 44%">
            Hospital
          </p>
          <img
            class="poi-marker"
            data-id="TownSign"

            src="assets/School.png"
            alt="School"
          />

          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 39%; left: 87.5%; width: 14%"
            src="assets/Neighborhood.png"
            alt="Neighborhood"
          />
          <p class="poi-marker poi-label" style="top: 46%; left: 92%">
            Neighborhood
          </p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 24%; left: 22.5%; width: 11%"
            src="assets/Bakery.png"
            alt="Bakery"
          />
          <p class="poi-marker poi-label" style="top: 33%; left: 24%">Bakery</p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 24%; left: 43.5%; width: 11%"

          />

          </p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 26%; left: 64.5%; width: 16%"
            src="assets/Pond.png"
            alt="Pond"
          />
          <p class="poi-marker poi-label" style="top: 27%; left: 70%">Pond</p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 30%; left: 54.5%; width: 11%"
            src="assets/TownCentre.png"
            alt="Town Centre"
          />
          <p class="poi-marker poi-label" style="top: 37%; left: 55%">
            Town Center
          </p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 11%; left: 58.5%; width: 13%"
            src="assets/Forest.png"
            alt="Forest"
          />
          <p class="poi-marker poi-label" style="top: 19%; left: 58%">Forest</p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 15%; left: 68%; width: 9%"

            alt="Playground"
          />

            Park
          </p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 22%; left: 79%; width: 12%"
            src="assets/Garden.png"
            alt="Garden"
          />
          <p class="poi-marker poi-label" style="top: 28%; left: 84%">
            Garden
          </p>
          <img
            class="poi-marker"
            data-id="TownSign"
            style="top: 76%; left: 90%; width: 12%"
            src="assets/Sign.png"
            alt="Sign"
          />
          <p class="poi-marker poi-label" style="top: 85%; left: 89%">
            Town Sign
          </p>
        </div>
      </section>
      <section class="info-section" id="info-section">
        <div id="poi-info">
          <img
            src="assets/Sign.png"
            alt="Image"
          />
          <h2>Tap a location on the map</h2>
          <p>Select a marker to see details.</p>
        </div>
        <button id="closeBtn">X</button>
      </section>
    </main>

    <!-- <footer class="app-footer">
      <small> Map </small>
    </footer> -->

    <script src="app.js"></script>
  </body>
</html>
