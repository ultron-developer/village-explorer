<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Village Explorer Prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Village Explorer</h1>
    </header>

    <main class="app-main">
      <section class="map-section">
        <div id="map-container">
          <img src="assets/map01.png" alt="" class="map-image" />
          <button
            class="poi-marker"
            data-id="oasis"
            style="top: 20%; left: 3.5%"
          >
            ●
          </button>
          <button
            class="poi-marker"
            data-id="cafeteria"
            style="top: 60%; left: 55%"
          >
            ●
          </button>
          <button class="poi-marker" data-id="lab" style="top: 25%; left: 70%">
            ●
          </button>
        </div>
      </section>
      <section class="info-section" id="info-section">
        <div id="poi-info">
          <h2>Tap a location on the map</h2>
          <p>Select a marker to see details.</p>
        </div>
        <button id="closeBtn">Close</button>
      </section>
    </main>

    <!-- <footer class="app-footer">
      <small> Map </small>
    </footer> -->

    <script src="app.js"></script>
  </body>
</html>
