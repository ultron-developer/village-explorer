<!doctype html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Village Explorer Prototype</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="app-header">
      <h1>Village Explorer</h1>
    </header>

    <main class="app-main">
      <section class="map-section">
        <div id="map-container">
          <img src="assets/map01.png" alt="" class="map-image" />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 72%; left: 54.05%; width: 9%"
            src="assets/Bridge.png"
            alt="Bridge"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 51%; left: 68%; width: 9%"
            src="assets/Fountain.png"
            alt="Fountain"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 55%; left: 36%; width: 7%"
            src="assets/Cemetery.png"
            alt="Cemetery"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 43%; left: 44%; width: 10%"
            src="assets/Hospital.png"
            alt="Hospital"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 40%; left: 67.5%; width: 9%"
            src="assets/School.png"
            alt="School"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 39%; left: 87.5%; width: 14%"
            src="assets/Neighborhood.png"
            alt="Neighborhood"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 24%; left: 22.5%; width: 11%"
            src="assets/Bakery.png"
            alt="Bakery"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 24%; left: 43.5%; width: 11%"
            src="assets/BookStore.png"
            alt="Book Store"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 26%; left: 64.5%; width: 16%"
            src="assets/Pond.png"
            alt="Pond"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 30%; left: 54.5%; width: 11%"
            src="assets/TownCentre.png"
            alt="Town Centre"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 11%; left: 58.5%; width: 13%"
            src="assets/Forest.png"
            alt="Forest"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 15%; left: 68%; width: 9%"
            src="assets/Playground.png"
            alt="Playground"
          />
          <img
            class="poi-marker"
            data-id="oasis"
            style="top: 22%; left: 79%; width: 12%"
            src="assets/Garden.png"
            alt="Garden"
          />
          <img
            class="poi-marker"
            data-id="Sign"
            style="top: 76%; left: 90%; width: 12%"
            src="assets/Sign.png"
            alt="Sign"
          />
        </div>
      </section>
      <section class="info-section" id="info-section">
        <div id="poi-info">
          <h2>Tap a location on the map</h2>
          <p>Select a marker to see details.</p>
        </div>
        <button id="closeBtn">Close</button>
      </section>
    </main>

    <!-- <footer class="app-footer">
      <small> Map </small>
    </footer> -->

    <script src="app.js"></script>
  </body>
</html>
